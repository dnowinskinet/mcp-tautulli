name: Lint and test customizations

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check tautulli.py tautulli_custom.py test_tautulli_custom.py
      - run: ruff format --check tautulli.py tautulli_custom.py test_tautulli_custom.py
      - run: pip install -e . pytest pytest-asyncio pytest-cov
      - run: pytest test_tautulli_custom.py --no-cov
